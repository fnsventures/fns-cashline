name: Check DNS siblings

# Manual only — the hourly schedule runs in fnsventures/petrolpump to avoid
# duplicate crons. This workflow calls the shared reusable job + canonical script.

on:
  workflow_dispatch:

concurrency:
  group: check-dns-siblings
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: DNS + env.js (auto-fix)
    uses: fnsventures/petrolpump/.github/workflows/reusable-check-dns-siblings.yml@main
    secrets:
      GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
      GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
