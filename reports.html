<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reports · FINDI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="js/env.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/brand.js"></script>
    <script defer src="js/appConfig.js"></script>
    <script defer src="js/supabase.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/geo.js"></script>
    <script defer src="js/reports.js"></script>
  </head>
  <body>
    <header id="app-topbar" class="no-print"></header>

    <main class="page">
      <div class="container page-grid">
        <section class="card no-print">
          <div class="toolbar">
            <div>
              <label for="report-month">Month</label>
              <input id="report-month" type="month" />
            </div>
            <button type="button" class="btn" id="print-btn">Print</button>
          </div>
        </section>

        <section class="card" id="report-body"></section>
      </div>
    </main>
  </body>
</html>
